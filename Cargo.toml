[package]
name = "prijmovy-potencial-dluznika"
version = "0.1.0"
edition = "2024"

[features]
definitions = []

[dependencies]
reqwest = { version = "0.13", features = ["json", "default-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"], default-features = false }
serde_json = { version = "1.0", default-features = false }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }